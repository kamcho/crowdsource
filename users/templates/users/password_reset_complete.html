{% extends 'base.html' %}
{% load static %}

{% block title %}Password updated — CrowdSource Import{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Password updated</h1>
            <p>Your password has been changed. You can now sign in with your new password.</p>
        </div>
        <a href="{% url 'users:signin' %}" class="btn btn-primary btn-block">Sign in</a>
    </div>
</section>
{% endblock %}
