# nginx site for CrowdSource Import
# Install to: /etc/nginx/sites-available/crowdsource  (then symlink into sites-enabled)
# Replace YOUR_DOMAIN and DROPLET_IP before first deploy.

upstream crowdsource_app {
    server unix:/run/crowdsource/crowdsource.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN DROPLET_IP;

    client_max_body_size 25M;

    location /static/ {
        alias /srv/crowdsource/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /srv/crowdsource/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://crowdsource_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# After running Certbot, it will add a matching `listen 443 ssl` server block
# automatically and redirect port 80 -> 443.
